[package]
name = "ringline-memcache"
version = "0.7.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Memcache client for the ringline io_uring runtime"

[features]
default = ["metrics"]
metrics = ["dep:histogram"]
# Forward the runtime's mio-backend override, so `--features force-mio` on
# this crate builds `ringline` with the mio backend.
force-mio = ["ringline/force-mio"]

[dependencies]
bytes = { workspace = true }
histogram = { workspace = true, optional = true }
itoa = { workspace = true }
ketama = { workspace = true }
ringline = { workspace = true }
memcache-proto = { workspace = true, features = ["binary"] }
thiserror = { workspace = true }

[dev-dependencies]
ringline = { workspace = true, features = ["testing"] }
