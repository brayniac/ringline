[package]
name = "ringline-tls-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "TLS configuration types shared by ringline and ringline-quic"
readme = "README.md"
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `tls12` because the builders enable TLS 1.2 next to 1.3 by default.
rustls = { workspace = true, features = ["std", "ring", "tls12"] }
rustls-pki-types = { workspace = true }
# A version floor only (RUSTSEC-2026-0382); see the workspace Cargo.toml.
rustls-webpki = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
