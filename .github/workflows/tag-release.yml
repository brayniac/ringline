name: Tag Release

on:
  push:
    branches: [main]

jobs:
  tag-release:
    uses: brayniac/rust-workflows/.github/workflows/tag-release.yml@v1
    secrets: inherit
    with:
      # The root is a virtual manifest; the core crate carries the released
      # version and its tag is `vX.Y.Z`.
      version-manifest: ringline/Cargo.toml
      # Forks run this on their own `main` too; only the upstream repo tags.
      only-repository: ringline-rs/ringline
      # The shared workflow's dev bump runs `cargo release version` across the
      # whole workspace, which would drag the satellite crates (redis,
      # memcache, the unpublished tools) to the core version — a downgrade for
      # some — and a `-alpha.0` core does not satisfy the workspace's
      # `ringline = "0.6"` path requirement. Bump by hand in the release PR
      # until the shared workflow supports a package-scoped bare-patch bump.
      dev-bump: none
