name: Tag Release

on:
  push:
    branches: [main]

jobs:
  tag-release:
    uses: brayniac/rust-workflows/.github/workflows/tag-release.yml@v1
    secrets: inherit
    with:
      # The root is a virtual manifest; the core crate carries the released
      # version and its tag is `vX.Y.Z`.
      version-manifest: ringline/Cargo.toml
      # Forks run this on their own `main` too; only the upstream repo tags.
      only-repository: ringline-rs/ringline
      # After tagging, open a PR bumping only the core crate to the next bare
      # patch version. Scoped to `ringline` because the satellite crates
      # (redis, memcache, the unpublished tools) version on their own cadence
      # and an unscoped bump would drag them to the core version; bare rather
      # than `-alpha.0` because the workspace's `ringline = "0.6"` path
      # requirement does not accept a prerelease.
      dev-bump: pr
      dev-bump-package: ringline
      dev-bump-style: patch
