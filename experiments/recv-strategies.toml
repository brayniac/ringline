# Receive-strategy comparison for docs/recv-into-accumulator-design.md
# (PR #622): answers its owner questions with data.
#
#   Q1 kernel floor: is a one-shot RECV into the region close to a
#      per-connection INC ring?          -> oneshot vs ring
#   Q2 SQPOLL: what do SQPOLL rings cost, with the one-shot arm they would
#      have to use?                       -> *-sqpoll vs ring / shared
#   Q3 buffered TLS on regions: what does a region cost per connection,
#      idle and loaded?                   -> idle_rss_kb / rss_kb by strategy
#
# `shared` runs at ringline's default ring and at a 16x larger one. It
# re-arms after the batch has replenished on -ENOBUFS, as ringline does, but
# has no fallback recv.
#
# One anvil VM over loopback: the server is confined to CPU 0 (its SQPOLL
# thread, when used, to CPU 1), the client runs on CPUs 2..; loopback
# captures server CPU per message, the quantity the strategies differ in.
# Five reps; within each rep the configuration order rotates, so no
# configuration always follows another.
name = "ringline recv strategies (#622)"

[params]
branch   = "exp/recv-strategies"
repo     = "https://github.com/brayniac/ringline"
reps     = "5"
warmup   = "3"
duration = "10"
threads  = "12"

[[jobs]]
name = "recv-strategies"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "spool/images/debian-13-ci-20260912.1@golden"
slots = 1
memory_gib = 8
ports = 0
gpu = false
payload_timeout = 10800
artifacts = ["/home/anvil/run.log"]
upload = true
payload = '''
set -uo pipefail
cd /home/anvil
{
  uname -srm; n=$(nproc); echo "nproc=$n"
  [ "$n" -ge 8 ] || { echo "FATAL: need >=8 CPUs"; exit 1; }
  git clone -q {repo} src && git -C src checkout -q {branch} && git -C src log --oneline -1
  (cd src/experiments/recv-strategies && cargo build --release --locked) || { echo "FATAL: build"; exit 1; }
  B=/home/anvil/src/experiments/recv-strategies/target/release/recv-strategies
  sudo sysctl -qw net.ipv4.ip_local_port_range="10000 65535" net.ipv4.tcp_tw_reuse=1 \
    net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535
  hard=$(ulimit -Hn); [ "$hard" = unlimited ] && hard=1048576; ulimit -n "$hard"
  echo "memlock=$(ulimit -l)"
  # shared at ringline's default ring (256 x 16 KiB) and tuned 16x larger,
  # which a deployment with many connections would do.
  configs=("shared" "shared --shared-bufs 4096" "ring" "oneshot" \
           "shared --sqpoll --sqpoll-cpu 1" "oneshot --sqpoll --sqpoll-cpu 1")
  port=7000
  for rep in $(seq 1 {reps}); do
    for conns in 64 1000 10000; do
      for size in 256 4096 65536 1048576; do
        # 1 MiB regions are resident under load: 10,000 of them exceed the VM.
        [ "$size" = 1048576 ] && [ "$conns" = 10000 ] && continue
        k=${#configs[@]}
        for i in $(seq 0 $((k-1))); do
          cfg=${configs[$(( (i + rep) % k ))]}
          port=$((port+1)); [ $port -gt 9900 ] && port=7001
          taskset -c 0 $B server --addr 127.0.0.1:$port --conns $conns --msg-size $size \
            --strategy $cfg --warmup {warmup} --duration {duration} > srv.out 2> srv.err &
          spid=$!
          sleep 0.3
          taskset -c 2-$((n-1)) $B client --addr 127.0.0.1:$port --conns $conns \
            --threads {threads} --msg-size $size --seconds $(( {warmup} + {duration} + 3 )) \
            --start-delay-ms 1000 > cli.out 2> cli.err
          wait $spid; src=$?
          r=$(grep '^RESULT' srv.out)
          if [ -z "$r" ]; then
            echo "FAIL rep=$rep conns=$conns size=$size cfg='$cfg' server_exit=$src"
            sed 's/^/  srv| /' srv.err | tail -5; sed 's/^/  cli| /' cli.err | tail -5
          else
            echo "ROW rep=$rep $r $(cat cli.out)"
          fi
        done
      done
    done
  done
  echo "DONE"
} 2>&1 | tee /home/anvil/run.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
grep -q '^DONE' run.log || { echo "run did not finish"; exit 1; }
echo "rows=$(grep -c '^ROW' run.log) fails=$(grep -c '^FAIL' run.log)"
'''
