mkdir -p /home/anvil/results
sudo prlimit --nofile=1048576:1048576 --memlock=unlimited:unlimited --pid $$
/home/anvil/out/bench-server-mio \
  --runtime ringline --addr {server_ip}:{port} --workers {workers} \
  --echo-mode forward --msg-size 256  \
  --metrics-out /home/anvil/results/echo-256b-c64-mio.metrics.json \
  > /home/anvil/results/echo-256b-c64-mio.server.log 2>&1 &
pid=$!
# Stop the server once all 64 client connections have opened and then
