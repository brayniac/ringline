  net.core.rmem_max=134217728 net.core.wmem_max=134217728
echo "KERNEL $(uname -r) nproc=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G"
./out/bench-server --print-backend
./out/bench-server-mio --print-backend
'''

