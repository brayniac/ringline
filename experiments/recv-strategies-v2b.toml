# Receive-strategy comparison for docs/recv-into-accumulator-design.md
# (PR #622): the v2 cells that failed in experiment
# 01a11274-6cf4-7199-2d59-f2af8fb4be91, rerun after two benchmark fixes.
# Every 10k-connection run asked for a CQ larger than the kernel's 65536
# entries; the shared strategies' accumulator never compacted under
# streaming and was OOM-killed. Same configurations as
# experiments/recv-strategies.toml.
#
# Configurations (DEFER_TASKRUN ring unless noted):
#   shared            ringline today: 256 x 16 KiB shared ring, lend-in-place
#                     when nothing is buffered, copy otherwise, fallback recv
#   shared_aa         the same configuration again, to measure noise (A/A)
#   shared_4096       the shared ring 16x larger, as a large deployment tunes it
#   shared_inc        the shared ring with IOU_PBUF_RING_INC (64 x 64 KiB)
#   ring              per-connection INC ring, posted entry rewritten in place
#   ring_norewrite    per-connection INC ring, posted entry never touched
#   oneshot           one-shot RECV into the connection's region
#   SQPOLL pair       shared and oneshot on an SQPOLL ring (thread on CPU 1),
#                     compared only with each other
# Regions start at 4 KiB and grow when a message needs it.
#
# Workloads (client CPUs 2.., server CPU 0, loopback, one VM):
#   reqack  one message outstanding per connection, 1-byte ack
#   pipe8   eight outstanding
#   mixed   90% 256 B, 10% 64 KiB messages
#   stream  continuous 16 KiB messages, no acks
#
# Each run prints the server RESULT line and the CLIENT line (acked/s, p50,
# p99, p999). main_util below 0.95 means the server was not saturated and
# the run measured something else; the analysis flags those runs.
name = "ringline recv strategies v2b (#622)"

[params]
branch   = "exp/recv-strategies"
repo     = "https://github.com/brayniac/ringline"
reps     = "5"
warmup   = "2"
duration = "8"
threads  = "12"

[[jobs]]
name = "recv-strategies"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "spool/images/debian-13-ci-20260912.1@golden"
slots = 1
memory_gib = 8
ports = 0
gpu = false
payload_timeout = 14400
artifacts = ["/home/anvil/run.log"]
upload = true
payload = '''
set -uo pipefail
cd /home/anvil
{
  uname -srm; n=$(nproc); echo "nproc=$n"; lscpu | grep -E "Model name|MHz" | head -3
  [ "$n" -ge 8 ] || { echo "FATAL: need >=8 CPUs"; exit 1; }
  git clone -q {repo} src && git -C src checkout -q {branch} && git -C src log --oneline -1
  (cd src/experiments/recv-strategies && cargo build --release --locked) || { echo "FATAL: build"; exit 1; }
  B=/home/anvil/src/experiments/recv-strategies/target/release/recv-strategies
  sudo sysctl -qw net.ipv4.ip_local_port_range="10000 65535" net.ipv4.tcp_tw_reuse=1 \
    net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535
  hard=$(ulimit -Hn); [ "$hard" = unlimited ] && hard=1048576; ulimit -n "$hard"
  echo "memlock=$(ulimit -l)"
  for len in 64 256 4096; do taskset -c 0 $B bytes-bench --iters 20000000 --len $len; done

  # label | server args
  defer=(
    "shared|--strategy shared"
    "shared_aa|--strategy shared"
    "shared_4096|--strategy shared --shared-bufs 4096"
    "shared_inc|--strategy shared_inc"
    "ring|--strategy ring"
    "ring_norewrite|--strategy ring_norewrite"
    "oneshot|--strategy oneshot"
  )
  sqp=(
    "shared_sqpoll|--strategy shared --sqpoll --sqpoll-cpu 1"
    "oneshot_sqpoll|--strategy oneshot --sqpoll --sqpoll-cpu 1"
  )
  # workload | conns | client args | server extra | sqpoll too?
  cells=(
    "reqack-256|10000|--msg-size 256||0"
    "reqack-4k|10000|--msg-size 4096||0"
    "reqack-64k|10000|--msg-size 65536||0"
    "stream-16k|64|--msg-size 16384 --stream|--no-ack|1"
    "stream-16k|1000|--msg-size 16384 --stream|--no-ack|0"
  )
  port=7000
  run_one() { # label, server args, workload, conns, client args, server extra, rep
    local label="$1" sargs="$2" wl="$3" conns="$4" cargs="$5" sextra="$6" rep="$7"
    port=$((port+1)); [ $port -gt 9900 ] && port=7001
    taskset -c 0 $B server --addr 127.0.0.1:$port --conns $conns $sargs $sextra \
      --warmup {warmup} --duration {duration} > srv.out 2> srv.err &
    local spid=$!
    sleep 0.3
    taskset -c 2-$((n-1)) $B client --addr 127.0.0.1:$port --conns $conns --threads {threads} \
      $cargs --warmup {warmup} --seconds $(( {warmup} + {duration} + 2 )) --start-delay-ms 1000 \
      > cli.out 2> cli.err
    wait $spid; local src=$?
    local r; r=$(grep '^RESULT' srv.out)
    if [ -z "$r" ]; then
      echo "FAIL rep=$rep wl=$wl conns=$conns cfg=$label server_exit=$src"
      sed 's/^/  srv| /' srv.err | tail -5; sed 's/^/  cli| /' cli.err | tail -5
    else
      echo "ROW rep=$rep wl=$wl cfg=$label $r $(cat cli.out)"
    fi
  }
  for rep in $(seq 1 {reps}); do
    for cell in "${cells[@]}"; do
      IFS='|' read -r wl conns cargs sextra withsq <<< "$cell"
      k=${#defer[@]}
      for i in $(seq 0 $((k-1))); do
        IFS='|' read -r label sargs <<< "${defer[$(( (i + rep) % k ))]}"
        run_one "$label" "$sargs" "$wl" "$conns" "$cargs" "$sextra" "$rep"
      done
      if [ "$withsq" = 1 ]; then
        for i in 0 1; do
          IFS='|' read -r label sargs <<< "${sqp[$(( (i + rep) % 2 ))]}"
          run_one "$label" "$sargs" "$wl" "$conns" "$cargs" "$sextra" "$rep"
        done
      fi
    done
  done
  echo "DONE"
} 2>&1 | tee /home/anvil/run.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
grep -q '^DONE' run.log || { echo "run did not finish"; exit 1; }
echo "rows=$(grep -c '^ROW' run.log) fails=$(grep -c '^FAIL' run.log)"
'''
