[ -n "$tid" ] || { echo "no rl-work-0 thread in pid $pid"; ps -L -o tid,comm,psr -p "$pid"; exit 1; }
echo "cell=0 tag=warmup arm=strict window=open pid=$pid worker_tid=$tid $(grep Cpus_allowed_list /proc/$pid/task/$tid/status | tr -d '\t')"
sleep $(({warmup} + 1))
a=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t0=$(date +%s%N)
sleep $(({duration} - 2))
b=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t1=$(date +%s%N)
echo "WORKER cell=0 tag=warmup arm=strict window=open cpu_ns=$((b - a)) wall_ns=$((t1 - t0))"
'''

[[jobs.steps]]
type = "barrier"
name = "done0-open"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
payload = '''
sudo systemctl kill -s INT srv0
for i in $(seq 1 50); do systemctl is-active --quiet srv0 || break; sleep 0.2; done
ss -ltnH "sport = :7900" | grep -q . && { echo "port 7900 still listening"; exit 1; }
echo "SERVER cell=0 tag=warmup arm=strict $(grep bytes_send_failed /home/anvil/logs/srv0-strict.log)"
'''

