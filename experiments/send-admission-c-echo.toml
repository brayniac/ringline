# Experiment C, uncontended (docs/send-admission-design.md, section 4): what
# each admission order costs a saturated worker's send_admitted against the
# strict order. Generated by send-admission-c-echo-gen.py; edit that.
#
# Server guest on hv02 (z1, 24 vCPU), bench-server with ONE worker, pinned by
# ringline to CPU 0. Client guest on hv01 (z2, 56 vCPU), {client_threads}
# threads. The X710 LAG between them, {msg_size} B messages, {clients}
# connections.
#
# Arms (label: bench-server --echo-mode and flags):
#   strict        with_bytes, then send_admitted (completion dropped) under
#                 the strict FIFO (O0)
#   budget-idle   the same under O7w, R = 32
#   split-pool    the same under O5, a small region of 256 x 4 KiB slots
#   bounded-idle  the same under O4
#
# Cells: 0=warmup:strict, 1=rep1:strict, 2=rep1:budget-idle, 3=rep1:split-pool, 4=rep1:bounded-idle, 5=rep2:budget-idle, 6=rep2:split-pool, 7=rep2:bounded-idle, 8=rep2:strict, 9=rep3:split-pool, 10=rep3:bounded-idle, 11=rep3:strict, 12=rep3:budget-idle, 13=rep4:bounded-idle, 14=rep4:strict, 15=rep4:budget-idle, 16=rep4:split-pool
# Each cell runs its own server on port 7900+k and two windows:
#   closed  one request in flight per connection, which saturates the worker.
#           Statistic: the worker thread's CPU time per operation, from
#           /proc/<pid>/task/<tid>/schedstat over the window (warm-up + 1 s
#           to the end - 1 s), divided by the client's operations.
#   open    {open_rate} requests/s offered, about half the closed-loop rate.
#           Statistic: the client's p99, measured from each request's
#           scheduled send time.
name = "send-admission C echo orders{run}"

[params]
bins_artifact  = "REPLACE-WITH-ARTIFACT-ID"
run            = "1"
image          = "debian-13-6.12"
server_ip      = "172.31.0.1"
client_ip      = "172.31.0.2"
client_threads = "16"
clients        = "256"
msg_size       = "256"
warmup         = "5"
duration       = "20"
open_rate      = "55000"

# -- server: hv02 --------------------------------------------------------------

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/* || exit 1
mkdir -p logs
cat /etc/anvil-image.json 2>/dev/null || cat /etc/anvil-instance.json; echo
uname -r; nproc
cat /sys/devices/system/clocksource/clocksource0/current_clocksource
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.core.rmem_max=134217728 net.core.wmem_max=134217728
ip -4 -brief addr show
( cd out && sha256sum * )
got=$(./out/bench-server --print-backend)
[ "$got" = io_uring ] || { echo "BACKEND MISMATCH: bench-server is $got"; exit 1; }
echo "run={run} backend=$got"
'''

# cell 0: warmup strict
[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "srv0"
payload = "exec /home/anvil/out/bench-server --runtime ringline --echo-mode bytes-admitted --admission-order strict --addr {server_ip}:7900 --workers 1 --msg-size {msg_size} > /home/anvil/logs/srv0-strict.log 2>&1"

[[jobs.steps]]
type = "barrier"
name = "ready0-closed"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
metrics = true
upload = true
payload = '''
pid=$(systemctl show -p MainPID --value srv0)
tid=$(ps -L -o tid=,comm= -p "$pid" | awk '$2=="rl-work-0" {print $1}')
[ -n "$tid" ] || { echo "no rl-work-0 thread in pid $pid"; ps -L -o tid,comm,psr -p "$pid"; exit 1; }
echo "cell=0 tag=warmup arm=strict window=closed pid=$pid worker_tid=$tid $(grep Cpus_allowed_list /proc/$pid/task/$tid/status | tr -d '\t')"
sleep $(({warmup} + 1))
a=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t0=$(date +%s%N)
sleep $(({duration} - 2))
b=$(cut -d' ' -f1 /proc/$pid/task/$tid/schedstat); t1=$(date +%s%N)
echo "WORKER cell=0 tag=warmup arm=strict window=closed cpu_ns=$((b - a)) wall_ns=$((t1 - t0))"
'''

[[jobs.steps]]
type = "barrier"
name = "done0-closed"
timeout = 1800

[[jobs.steps]]
type = "barrier"
name = "ready0-open"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
metrics = true
upload = true
