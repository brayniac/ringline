# Can batching be bought without concentrating connections?
#
# The coalescing sweep (docs/listeners-and-accept-design.md, "Spreading a fixed
# load costs per-operation efficiency") found CQE/op falling with the worker
# count at fixed load: 0.86 at 4 workers, 1.70 at 8, against a ~2.0 ceiling of
# one recv plus one send per echo. Below 1.0 means a single completion is
# carrying several arrivals. The mechanism is that a worker holding more
# connections finds more work per wakeup, so the efficiency is bought with
# concentration -- and concentration is what a balancer is trying to undo.
#
# That framing has a testable consequence: if the efficiency comes from how much
# work a wakeup finds, then waiting for more work before waking should buy it
# without moving a single connection.
#
# The lever is `min_complete`, the argument to `io_uring_enter`, hardcoded to 1
# (return as soon as anything is ready) until #483's follow-on exposed it. It is
# NOT `tick_timeout_us`: that is submitted as a Timeout SQE, so it bounds idle
# blocking and contributes exactly one CQE per window. An earlier version of the
# design doc named the wrong knob; 7462a18 corrected it.
#
# PREDICTION, written before the run:
#
#   * CQE/op falls monotonically with min_complete, toward the ~0.9 that 4
#     workers reached, because each wait returns a fuller batch.
#   * p50 rises, because the first arrival in a batch waits for the last. The
#     question is how much.
#   * CPU falls with CQE/op, since the per-completion bookkeeping is the cost.
#
# GO if CQE/op falls toward 0.9 while p50 stays under the 4-worker figure
# (1607us): batching is then separable from placement, and an adaptive
# controller is worth designing. NO-GO if CQE/op is flat -- the premise is
# wrong, the efficiency is not about batch size, and no controller helps. Also
# NO-GO if CQE/op falls but p50 overshoots the 4-worker figure: then batching
# costs more latency than concentrating connections does, and concentration is
# simply the better trade.
#
# Nothing adaptive gets built before this fixed sweep says which.
#
# MECHANISM, and why the response may be threshold-shaped rather than smooth.
# Blocking the reaper does not by itself stop the kernel posting completions --
# multishot recv re-arms in the kernel and fires on arrival whether or not the
# application has reaped anything. The coupling runs through the provided buffer
# ring instead: a recv CQE checks a buffer out, and it is the application that
# returns it (`pending_replenish`, committed in `flush_replenish_and_rearm`).
# While the worker is blocked in `io_uring_enter` those buffers stay checked
# out, so a long enough block runs the ring dry -- and a kernel with no provided
# buffer cannot post a recv completion, so bytes accumulate in the socket buffer
# and the next recv carries more of them. That is the same mechanism the worker
# count sweep exercised, induced by delay instead of by load.
#
# It predicts a threshold, not a proportionality: nothing should change until
# the block is long enough to exhaust the ring. So a flat n=2 followed by a
# drop at n=4 or n=8 is a CONFIRMATION with a threshold, not a refutation, and
# flat-everywhere at these n is weak evidence -- the honest reading would be
# "not with this buffer ring at this delay", and the follow-up is a smaller
# recv ring rather than abandoning the idea.
#
# n=1 is a REPLICATE of the coalesce sweep's 8-worker point, not just a control
# arm: same 256 connections, 600k offered, 64B, park off, merged accept. It
# should land near 1.70 CQE/op and p50 862us. If it does not, the two sweeps are
# not comparable and the 0.9 target is not the right bar.
#
# Not measured here: the low-load stall. Waiting for n completions when fewer
# than n are outstanding blocks until the tick timeout supplies them, so the
# worst case is roughly n tick windows. At 32 connections per worker under
# saturation there are always more than 8 recvs outstanding, so this sweep
# cannot see that failure mode. It is why the knob ships EXPERIMENTAL and
# defaults to 1.
name = "mincomplete n{min_complete} rep{rep}"

[matrix]
context_name = "ringline: can batching be bought without concentration? (#443)"
min_complete = ["1", "2", "4", "8"]
rep = ["1"]

[params]
# Update to the artifact id of a fresh `ringline min-complete build`.
bins_artifact = "01a0e921-ca58-731a-e957-3bf6e46b3e78"
image         = "spool/images/debian-13-base-20260912.1@golden"
server_ip     = "172.31.0.1"
client_ip     = "172.31.0.2"
port          = "7878"
# Identical to the coalesce sweep so the n=1 arm replicates its 8-worker point.
workers       = "8"
clients       = "256"
rate          = "600000"
msg_size      = "64"
warmup        = "5"
duration      = "90"

# ── server: hv02 ───────────────────────────────────────────────────────────

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535
nproc
uname -r
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "ringline-server"
payload = '''
exec /home/anvil/out/bench-server --runtime ringline --addr {server_ip}:{port} \
  --workers {workers} --msg-size {msg_size} --accept-mode merged \
  --echo-mode forward --wait-min-complete {min_complete} \
  --metrics-out /home/anvil/metrics.json
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/cpu.tgz"]
payload = '''
set -uo pipefail
cd /home/anvil
mkdir -p cpu
echo "min_complete={min_complete} workers={workers} rep={rep}" > cpu/arm.txt

# One window over the steady state: there is no readmit here, so the before/
# after pair the park runs needed collapses to a single span.
sleep 12
grep '^cpu[0-9]' /proc/stat > cpu/stat-open
sleep 70
grep '^cpu[0-9]' /proc/stat > cpu/stat-close

# Sample every cpu and score it without assuming a worker->cpu mapping. The
# guest enumerates SMT siblings adjacently, so ringline's SMT-aware pinning
# puts worker W on cpu 2W; a cpu0..cpu7 window would miss half the workers.
# That mistake cost a whole round of park runs.
awk '
  FNR==NR { for (i=2;i<=NF;i++) b[$1,i]=$i; next }
  {
    tot=0; for (i=2;i<=NF;i++) tot += $i - b[$1,i]
    idle=($5-b[$1,5])+($6-b[$1,6])
    pct = (tot>0 ? 100.0*(tot-idle)/tot : 0)
    printf "%s %.1f\n", $1, pct
    sum += pct; if (pct > 50) loaded++
  }
  END { printf "SUMMARY loaded_cores=%d total_busy_pct=%.1f\n", loaded+0, sum+0 }
' cpu/stat-open cpu/stat-close | tee cpu/per-core.txt

cp /home/anvil/metrics.json cpu/ 2>/dev/null || echo "no metrics.json yet" >> cpu/per-core.txt
tar czf /home/anvil/cpu.tgz -C /home/anvil cpu
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/metrics.json"]
payload = '''
# SIGTERM so the server runs its shutdown path and dumps counters.
sudo systemctl stop ringline-server 2>/dev/null || true
sleep 2
echo "--- counters ---"
python3 - <<'EOF'
import json,sys
m = dict()
for e in json.load(open("/home/anvil/metrics.json")):
    m[(e["name"], e.get("op"))] = e["value"]
def g(n, o):
    return m.get(("ringline/" + n, o))
acc = g("connections", "accepted")
for k in ("accepted", "adopted", "park_started", "park_completed"):
    print("%-16s= %s" % (k, g("connections", k)))
print("%-16s= %s" % ("bytes_received", g("bytes", "received")))
# The run has to prove it carried load before any ratio computed from it means
# anything. accepted==1 is the /dev/tcp reachability probe alone -- the
# signature of a client that never started, which made six park runs unreadable.
want = {clients}
if acc is None or acc < want:
    print("FATAL: accepted=%s < clients=%s: no workload, counters uninterpretable" % (acc, want))
    sys.exit(1)
print("workload OK: accepted=%s >= clients=%s" % (acc, want))
EOF
rc=$?
exit $rc
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

# ── client: hv01 ───────────────────────────────────────────────────────────

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/*
sudo prlimit --nofile=1000000 --pid $$ 2>/dev/null || true
echo "fd soft=$(ulimit -Sn) hard=$(ulimit -Hn) clients={clients}"
ip -4 -brief addr show
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/client.log"]
payload = '''
set -uo pipefail
cd /home/anvil
for i in $(seq 1 120); do
  (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; echo "server reachable after ${i}s"; break; }
  sleep 1
done
# Open loop at a fixed offered rate: the question is the cost per operation at
# constant throughput, so the load must not adapt to the server's latency the
# way a closed loop would.
./out/bench-client --runtime ringline --addr {server_ip}:{port} --clients {clients} \
  --threads 8 --msg-size {msg_size} --warmup {warmup} --duration {duration} \
  --open --rate {rate} \
  2>&1 | tee /home/anvil/client.log
rc=${PIPESTATUS[0]}
echo "client_rc=${rc}" | tee -a /home/anvil/client.log
# A run with no load must not be reportable as a result.
exit "$rc"
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
