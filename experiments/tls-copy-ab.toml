# TLS copy A/B: server CPU per operation with ringline-tls as released
# (arm tls) and with a ringline-rs/rustls patch (arm patch), next to plain
# TCP (arm plain). Submitted once per value size (vlen 64, 4096 and 65536)
# and repetition. Arms run in sequence on one VM pair in the order of
# {arms}; the default plain,tls,patch,patch,tls repeats each TLS arm so the
# within-run spread of the same binary is a noise floor for the difference.
# During each arm's 20 s measured window the server records /proc/stat
# deltas; no profiler runs, so the window has no profiling overhead. Per-op
# CPU = (user + system + softirq core-seconds in the window) / (ops in the
# window, from the client's rate).
# The workload is 80% GET, so the server's sends carry the values and a
# send-path patch acts on vlen bytes per GET.
# Prediction for rustls patch 1 (encrypt_into: one plaintext copy per send
# instead of two), written before running: at vlen 64 patch and tls differ
# by no more than the spread between the two tls arms; at vlen 65536 patch
# uses less server CPU per op than tls by more than that spread; vlen 4096
# lies between. A vlen 65536 difference inside the spread refutes the copy
# being a measurable cost at this load.
# Server bins: tls-copy-ab-build.toml (out/resp-server, out/resp-server-patch).
# Client: the C8 cachecannon (client_bins); it runs TLS too, so client CPU
# may limit throughput in the TLS arms. Per-op server CPU does not depend
# on that.
name = "tls copy ab v{vlen} d{depth} c{conns} rep{rep}"

[params]
bins_artifact  = "REPLACE-WITH-ARTIFACT-ID"
client_bins    = "01a159f3-e054-73af-bc3f-8b6ea08f60b1"
image          = "debian-13-ci"
rep            = "1"
server_ip      = "172.31.0.1"
client_ip      = "172.31.0.2"
port           = "6379"
arms           = "plain tls patch patch tls"
vlen           = "4096"
depth          = "16"
conns          = "2048"
keys           = "20000"
client_threads = "16"

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "barrier"
name = "vms-up"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/profile.tgz"]
payload_timeout = 3600
inputs = [
  { artifact = "{bins_artifact}", name = "bins.tgz", dest = "/home/anvil" },
]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bins.tgz && chmod +x out/resp-server out/resp-server-patch
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.core.rmem_max=134217728 net.core.wmem_max=134217728 >/dev/null
# The guest's hard nofile limit is below 1048576, so `ulimit -n` alone
# leaves the soft limit at 1024.
ulimit -n 1048576 2>/dev/null || sudo prlimit --nofile=1048576:1048576 --pid $$
ulimit -l unlimited 2>/dev/null || sudo prlimit --memlock=unlimited:unlimited --pid $$
echo "server-limits memlock=$(ulimit -l) nofile=$(ulimit -n)"
mkdir -p prof
nproc; uname -r
( cd out && sha256sum resp-server resp-server-patch )
conns() { ss -Htn state established "( sport = :{port} )" | wc -l; }
i=0
for arm in {arms}; do
  i=$((i+1))
  case $arm in
    plain) bin=resp-server;       args="--runtime ringline --send-slot 16448" ;;
    tls)   bin=resp-server;       args="--runtime ringline --send-slot 16448 --tls" ;;
    patch) bin=resp-server-patch; args="--runtime ringline --send-slot 16448 --tls" ;;
    *) echo "BAD ARM $arm"; exit 1 ;;
  esac
  ./out/$bin $args --addr {server_ip}:{port} --workers 8 > prof/$i-$arm.server.log 2>&1 &
  pid=$!
  for j in $(seq 1 600); do [ "$(conns)" -ge {conns} ] && break; sleep 0.5; done
  # past the client's 10 s warmup
  sleep 15
  cat /proc/stat > prof/$i-$arm.stat0
  sleep 20
  cat /proc/stat > prof/$i-$arm.stat1
  echo "== $i $arm conns=$(conns)"
  for j in $(seq 1 600); do [ "$(conns)" -eq 0 ] && break; sleep 0.5; done
  kill $pid; wait $pid 2>/dev/null
  sleep 2
done
python3 - <<'PY'
import os
hz=os.sysconf("SC_CLK_TCK"); W=20.0
for i,arm in enumerate("{arms}".split(), 1):
    def stat(f):
        for l in open(f"prof/{i}-{arm}.{f}"):
            if l.startswith("cpu "): return list(map(int,l.split()[1:9]))
    a,b=stat("stat0"),stat("stat1")
    names=["user","nice","system","idle","iowait","irq","softirq","steal"]
    d={n:(y-x)/hz/W for n,x,y in zip(names,a,b)}
    busy=d["user"]+d["system"]+d["softirq"]
    print(f"== {i} {arm}: busy={busy:.3f} cores " + " ".join(f"{n}={d[n]:.2f}" for n in names if n!="idle"))
PY
sudo chown -R anvil prof
tar czf /home/anvil/profile.tgz prof
exit 0
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "barrier"
name = "vms-up"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
payload_timeout = 3600
inputs = [{ artifact = "{client_bins}", name = "bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bins.tgz && chmod +x out/*
sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 net.ipv4.ip_local_port_range="1024 65535" >/dev/null
ulimit -n 1048576 2>/dev/null || sudo prlimit --nofile=1048576:1048576 --pid $$
ulimit -l unlimited 2>/dev/null || sudo prlimit --memlock=unlimited:unlimited --pid $$
echo "client-limits memlock=$(ulimit -l) nofile=$(ulimit -n)"
for arm in plain tls patch; do
  tls=true; [ $arm = plain ] && tls=false
  cat > cell-$arm.toml <<CFG
[general]
duration = "50s"
warmup = "10s"
threads = {client_threads}
[target]
endpoints = ["{server_ip}:{port}"]
protocol = "resp"
tls = $tls
tls_verify = false
tls_hostname = "localhost"
[connection]
connections = {conns}
pipeline_depth = {depth}
connect_timeout = "10s"
request_timeout = "60s"
[workload]
backfill_on_miss = true
[workload.keyspace]
length = 16
count = {keys}
distribution = "uniform"
[workload.commands]
get = 80
set = 20
[workload.values]
length = {vlen}
[admin]
format = "json"
CFG
done
i=0
for arm in {arms}; do
  i=$((i+1))
  for j in $(seq 1 300); do (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; break; }; sleep 1; done
  ./out/cachecannon-a cell-$arm.toml > $i-$arm.json 2> $i-$arm.log
  echo "== $i $arm"; grep '"type":"result"' $i-$arm.json || { echo "NO RESULT"; tail -20 $i-$arm.log; }
  sleep 8
done
exit 0
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
