name = "ktls-premise-probe"

# Premise checks for docs/ktls-design.md. Read-only probes: no load, no tuning,
# no persistent state. Everything runs against loopback socket pairs.
#
# Sources are base64-embedded so TOML escape processing cannot corrupt them.

[[jobs]]
name = "ktls-probe"
tags = ["z2.baremetal"]

[[jobs.steps]]
name = "host-facts"
type = "shell"
command = """
set -x
uname -a
cat /etc/os-release | head -3
zcat /proc/config.gz 2>/dev/null | grep -E '^CONFIG_TLS' || echo 'no /proc/config.gz'
grep -E 'CONFIG_TLS' /boot/config-$(uname -r) 2>/dev/null || echo 'no /boot/config'
sudo modprobe tls 2>&1 || true
lsmod | grep -E '^tls' || echo 'tls module not loaded'
ls -l /proc/net/tls_stat 2>/dev/null && cat /proc/net/tls_stat || echo 'no /proc/net/tls_stat'
echo '--- NICs ---'
ip -br link
for d in $(ls /sys/class/net); do
  [ "$d" = lo ] && continue
  drv=$(basename $(readlink -f /sys/class/net/$d/device/driver) 2>/dev/null || echo '?')
  echo "== $d driver=$drv"
  ethtool -i $d 2>/dev/null | head -4
  ethtool -k $d 2>/dev/null | grep -i tls || echo "  (no tls-hw-* features advertised)"
done
echo '--- rustc ---'
(source "$HOME/.cargo/env" 2>/dev/null || true); rustc --version || echo 'no rustc'
exit 0
"""

[[jobs.steps]]
name = "setsockopt-probe"
type = "shell"
command = """
set -e
mkdir -p /tmp/ktls-probe && cd /tmp/ktls-probe
echo '' | base64 -d > ktls_probe.c
cc -O2 -Wall -o ktls_probe ktls_probe.c
set +e
./ktls_probe; rc=$?
echo "ktls_probe exit=$rc"
exit $rc
"""

[[jobs.steps]]
name = "io-uring-fixed-fd-probe"
type = "shell"
command = """
set -e
if ! command -v cargo >/dev/null && [ -f "$HOME/.cargo/env" ]; then source "$HOME/.cargo/env"; fi
if ! command -v cargo >/dev/null; then
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
  source "$HOME/.cargo/env"
fi
rustc --version
mkdir -p /tmp/ktls-uring/src && cd /tmp/ktls-uring
cat > Cargo.toml <<'CARGOEOF'
[package]
name = "ktls-uring-probe"
version = "0.0.0"
edition = "2021"

[dependencies]
io-uring = "0.7.12"
libc = "0.2"

[[bin]]
name = "ktls-uring-probe"
path = "src/main.rs"
CARGOEOF
echo '' | base64 -d > src/main.rs
cargo build --release 2>&1 | tail -20
set +e
./target/release/ktls-uring-probe; rc=$?
echo "ktls_uring_probe exit=$rc"
exit $rc
"""
