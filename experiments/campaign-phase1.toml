# Release comparison campaign, phase 1: closed-loop peak throughput.
#
# Two guests on the X710 LAG — bench-server on hv02 (z1, 24 vCPU), bench-client
# on hv01 (z2, 56 vCPU) so the load generator is never the bottleneck. One arm
# per (config, connections); each arm sweeps message sizes in-process so the
# guest boot is paid once.
#
# `config` selects the server under test:
#   uring    ringline, io_uring backend
#   mio      ringline, mio backend
#   tokio    tokio reference
#   rfwd     ringline io_uring with the zero-copy recv-forward path
#
# One message size per arm, deliberately: the server's rezolus recording spans
# the whole arm, and there is no way to slice a recording by time after the
# fact, so a multi-size arm cannot attribute CPU or syscalls to a size. One
# size per arm makes each recording map to exactly one cell.
#
# There is no hand-rolled CPU sampler here. rezolus already records per-CPU
# `cpu_usage` by state and per-task `task_cpu_usage` by comm on this guest; a
# /proc/stat sampler was redundant and got the accounting wrong (it counted
# iowait as busy, which makes an io_uring server blocked in submit_and_wait
# look like it is burning every core).
#
# Phase 1's output is the saturation point each phase 2 open-loop rate is
# expressed as a fraction of; see docs/journal/2026-09-release-comparison-campaign.md.
name = "ringline campaign p1 {config} c{clients} s{msg_size} rep{rep}"

[params]
bins_artifact = "REPLACE"
config        = "uring"
server_bin    = "bench-server-uring"
runtime       = "ringline"
server_flags  = ""
rep           = "1"
workers       = "8"
msg_size      = "256"
image         = "spool/images/debian-13-base-20260912.1@golden"
server_ip     = "172.31.0.1"
client_ip     = "172.31.0.2"
port          = "7878"
clients       = "64"
warmup        = "5"
duration      = "20"
client_threads = "16"

# ── server: hv02 ───────────────────────────────────────────────────────────

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/bench-*
cat /etc/anvil-instance.json
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 \
  net.core.rmem_max=134217728 net.core.wmem_max=134217728
nproc; ip -4 -brief addr show
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "ringline-server"
metrics = true
payload = "exec /home/anvil/out/{server_bin} --runtime {runtime} --addr {server_ip}:{port} --workers {workers} {server_flags}"

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

# ── client: hv01 ───────────────────────────────────────────────────────────

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/bench-*
sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 \
  net.ipv4.ip_local_port_range="1024 65535"
ip -4 -brief addr show
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
metrics = true
upload = true
artifacts = ["/home/anvil/results.tgz"]
payload = '''
set -uo pipefail
cd /home/anvil
for i in $(seq 1 120); do
  (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; break; }
  sleep 1
done
ulimit -n 500000
mkdir -p results
echo "config={config} clients={clients} rep={rep} workers={workers} size={msg_size}" | tee results/arm.txt
./out/bench-client --runtime ringline --addr {server_ip}:{port} --clients {clients} \
  --msg-size {msg_size} --warmup {warmup} --duration {duration} --threads {client_threads} \
  > results/results-{msg_size}.json 2> results/client.log
cat results/results-{msg_size}.json
tar czf results.tgz results
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true
