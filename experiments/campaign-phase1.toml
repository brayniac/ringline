# Release comparison campaign, phase 1: closed-loop peak throughput.
#
# Two guests on the X710 LAG — bench-server on hv02 (z1, 24 vCPU), bench-client
# on hv01 (z2, 56 vCPU) so the load generator is never the bottleneck. One arm
# per (config, connections); each arm sweeps message sizes in-process so the
# guest boot is paid once.
#
# `config` selects the server under test:
#   uring    ringline, io_uring backend
#   mio      ringline, mio backend
#   tokio    tokio reference
#   rfwd     ringline io_uring with the zero-copy recv-forward path
#
# Phase 1's output is the saturation point each phase 2 open-loop rate is
# expressed as a fraction of. Every arm must pass experiments/phase0-gate.py
# before its numbers are used; see docs/journal/2026-09-release-comparison-campaign.md.
name = "ringline campaign p1 {config} c{clients} rep{rep}"

[params]
bins_artifact = "REPLACE"
config        = "uring"
server_bin    = "bench-server-uring"
runtime       = "ringline"
server_flags  = ""
rep           = "1"
workers       = "8"
msg_sizes     = "256 1024 4096 16384"
image         = "spool/images/debian-13-base-20260912.1@golden"
server_ip     = "172.31.0.1"
client_ip     = "172.31.0.2"
port          = "7878"
clients       = "64"
warmup        = "5"
duration      = "20"
client_threads = "16"

# ── server: hv02 ───────────────────────────────────────────────────────────

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/bench-*
cat /etc/anvil-instance.json
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 \
  net.core.rmem_max=134217728 net.core.wmem_max=134217728
nproc; ip -4 -brief addr show
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "ringline-server"
metrics = true
payload = "exec /home/anvil/out/{server_bin} --runtime {runtime} --addr {server_ip}:{port} --workers {workers} {server_flags}"

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

# Sample per-core utilization across the client's measurement window. Read
# straight from /proc/stat so the guest needs no extra packages: two snapshots
# and a delta, emitted as `cpuN <busy percent>` — the format phase0-gate.py
# parses.
[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/percore.txt"]
payload = '''
set -uo pipefail
cd /home/anvil
# busy = user+nice+system+irq+softirq+steal. iowait ($6) is deliberately
# EXCLUDED: a worker blocked in io_uring's `submit_and_wait` is accounted as
# iowait, not idle, so counting it as busy makes an idle io_uring server look
# like it is burning every core. Measured at 1 connection: cores showed
# iowait=97%, user=0.2%, sys=2.5% — i.e. ~22% of one core in total, against a
# naive reading of 806%. epoll-based runtimes do not have this accounting
# quirk, so including iowait does not merely add noise, it biases the
# comparison against io_uring specifically.
snap() { awk '/^cpu[0-9]/ {print $1, $2+$3+$4+$7+$8+$9, $5+$6}' /proc/stat; }
# Cover the whole size sweep: placement is not size-dependent, so one window
# spanning every size is the right sample for a funnel check.
sleep 8
snap > /tmp/s1
sleep 80
snap > /tmp/s2
join /tmp/s1 /tmp/s2 \
  | awk '{b=$4-$2; i=$5-$3; t=b+i; if (t>0) printf "%s %.1f\n", $1, 100*b/t}' \
  > percore.txt
echo "== per-core busy% over the measurement window"; cat percore.txt
echo "== hottest / median"
sort -k2 -n percore.txt | awk '{v[NR]=$2} END {printf "hottest=%.1f median=%.1f cores=%d\n", v[NR], v[int(NR/2)+1], NR}'
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

# ── client: hv01 ───────────────────────────────────────────────────────────

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/bench-*
sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 \
  net.ipv4.ip_local_port_range="1024 65535"
ip -4 -brief addr show
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
metrics = true
upload = true
artifacts = ["/home/anvil/results.tgz"]
payload = '''
set -uo pipefail
cd /home/anvil
for i in $(seq 1 120); do
  (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; break; }
  sleep 1
done
ulimit -n 500000
mkdir -p results
echo "config={config} clients={clients} rep={rep} workers={workers}" | tee results/arm.txt
for size in {msg_sizes}; do
  ./out/bench-client --runtime ringline --addr {server_ip}:{port} --clients {clients} \
    --msg-size $size --warmup {warmup} --duration {duration} --threads {client_threads} \
    > results/results-$size.json 2> results/client-$size.log
  echo "== msg_size=$size"; cat results/results-$size.json; echo
done
tar czf results.tgz results
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 3600

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true
