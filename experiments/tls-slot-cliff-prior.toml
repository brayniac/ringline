name = "tls-slot-cliff: cycles vs clock (rustc 1.98.1)"

# Fourth job. Settles WHY later cells in the sweep are slower, which is the
# last open piece of the mystery.
#
# Established so far:
#   job 1 (01a0700d) - per-cell in its own process, 16384 vs 16448 at 1 KiB is a
#     dead heat: 536.38 vs 535.82 ns/op, cycles +0.06%, instructions +0.00%.
#     AnonHugePages is 0 for the pool's VMA at every slot size, so THP backs
#     none of it and cannot be the mechanism. End to end the arms differ by
#     +0.24% on the TLS row and +0.35% on the plaintext control.
#   job 2 (01a0701f) - the cliff is measurement POSITION. The same slot size
#     measured first and last in one process differs by +2.5% to +5.4% in all
#     8 arms, and reversing the sweep moves the penalty onto whichever size now
#     sits last.
#   job 3 (01a07022) - /proc/cpuinfo reports a flat 3700 MHz for every cell, but
#     under acpi-cpufreq with the performance governor that is the nominal
#     P-state, not achieved clock. Inconclusive instrument, not a result.
#
# So: ns/op rises ~4% with position. Does the WORK rise, or only the clock?
# perf stat can answer that, but only for a process that measures one cell.
# prior_work_control synthesises position inside a single-cell process by
# running the identical encrypt loop untimed for RL_PRIOR_MS first, and the
# RL_MEASURE=0 arm gives the subtraction that isolates the measured loop.
#
# Predictions, stated before the run:
#   * clock/boost residency  -> cycles/op flat, ns/op up, derived GHz down.
#   * microarchitectural     -> cycles/op up in step with ns/op, GHz flat.
#   * does not reproduce     -> prior work is not what position stands for, and
#                               the allocator path (base addresses, printed per
#                               arm) is the next place to look.
#
# host: hv01 = z2.baremetal = 3970X, pinned to CPU 20.

[params]
ringline_repo = "https://github.com/brayniac/ringline"
micro_ref     = "bench/tls-slot-cliff"
micro_cpu     = "20"
toolchain     = "1.98.1"
iters         = "4000000"

[[jobs]]
name = "prior"
tags = ["z2.baremetal"]

[[jobs.steps]]
name = "build"
type = "shell"
command = """
set -eu
source "$HOME/.cargo/env"
rustup toolchain install {toolchain} --profile minimal
echo "pinned toolchain is: $(rustup run {toolchain} rustc --version)"
DIR=/tmp/slotcliff/micro98
if [ -d "$DIR/.git" ]; then
    cd "$DIR" && git fetch --all -p && git checkout {micro_ref} && git reset --hard origin/{micro_ref}
else
    rm -rf "$DIR" && git clone {ringline_repo} "$DIR" && cd "$DIR" && git checkout {micro_ref}
fi
cd "$DIR"
echo "micro at $(git rev-parse --short HEAD)"
CARGO_TARGET_DIR=target-buf rustup run {toolchain} cargo test --release -p ringline --lib --no-run 2>&1 | tee /tmp/slotcliff/d1.log
BUF=$(grep -o 'Executable unittests src/lib.rs ([^)]*)' /tmp/slotcliff/d1.log | tail -1 | sed 's/.*(\\(.*\\))/\\1/')
echo "export MICRO_BUF=$DIR/$BUF" > /tmp/slotcliff/env4.sh
cat /tmp/slotcliff/env4.sh
test -x "$DIR/$BUF" && echo "BUILD OK"
"""

[[jobs.steps]]
name = "cycles-vs-clock"
type = "shell"
command = """
set -u
source "$HOME/.cargo/env"
source /tmp/slotcliff/env4.sh
: > prior.txt
{ echo "=== uptime (start) ==="; uptime; echo "cargo/rustc procs: $(pgrep -c -x 'cargo|rustc' || true)"; } | tee -a prior.txt

# task-clock gives the wall time the counters cover, so cycles/task-clock is
# the achieved GHz over exactly the counted region.
EV="cycles,instructions,task-clock,L1-dcache-load-misses"

for rep in 1 2 3; do
  for prior in 0 4000; do
    for meas in 1 0; do
      echo "### rep=$rep prior_ms=$prior measure=$meas" >> prior.txt
      sudo perf stat -x, -e "$EV" -- \
        taskset -c {micro_cpu} \
        env RL_PRIOR_MS=$prior RL_SLOT=16384 RL_SIZE=1024 RL_ITERS={iters} RL_MEASURE=$meas \
        "$MICRO_BUF" --exact tls::send_microbench::prior_work_control \
        --nocapture --test-threads=1 >> prior.txt 2>&1
      echo "rc=$?" >> prior.txt
    done
  done
done
{ echo "=== uptime (end) ==="; uptime; } | tee -a prior.txt
grep -E '^W|^B|^###' prior.txt | head -40
"""

[[jobs.steps]]
name = "upload-prior"
type = "upload_artifact"
path = "prior.txt"
