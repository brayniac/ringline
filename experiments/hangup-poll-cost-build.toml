# Build resp-server from exp/hangup-poll-cost for the hangup poll cost
# comparison (experiments/hangup-poll-cost.toml). One binary serves both
# arms: RINGLINE_EXP_NO_HANGUP_POLL set in the server's environment skips
# Driver::arm_hangup_poll. The client is the C8 cachecannon from the
# recv-direct scale run, passed to the run spec as a second artifact.
name = "hangup poll cost build ({ref})"

[params]
repo  = "https://github.com/brayniac/ringline"
ref   = "exp/hangup-poll-cost"
image = "debian-13-ci"

[[jobs]]
name = "build"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z4.c"
image = "{image}"
slots = 1
memory_gib = 8
ports = 0
gpu = false
payload_timeout = 3600
artifacts = ["/home/anvil/bins.tgz", "/home/anvil/build.log"]
upload = true
payload = '''
set -uo pipefail
cd /home/anvil
{
  cat /etc/anvil-instance.json
  echo "kernel: $(uname -r)"
  mkdir -p out
  git clone -q {repo} src && git -C src checkout -q {ref}
  echo "ringline: $(git -C src log --oneline -1)"
  rustc --version
  ( cd src && cargo build --release --locked -p ringline-bench --bin resp-server ) || exit 1
  cp src/target/release/resp-server out/
  ( cd out && sha256sum * )
  tar czf bins.tgz out
} 2>&1 | tee /home/anvil/build.log
rc=${PIPESTATUS[0]}
echo "build_status=$rc" | tee -a /home/anvil/build.log
exit 0
'''
