# Build Experiment D's admission-server and admission-load from {ref} with
# forced frame pointers, for send-admission-d-profile.toml. One artifact,
# bench-bins.tgz (out/admission-server, out/admission-load), io_uring builds
# without target-cpu=native and without stripping, so perf can walk user
# stacks by frame pointer and name their functions from the symbol table.
name = "send-admission D profile build ({ref})"

[params]
repo = "https://github.com/brayniac/ringline"
ref  = "3db626d8"

[[jobs]]
name = "build"
tags = ["validation"]

[[jobs.steps]]
type = "anvil-vm"
shape = "auto.c"
image = "debian-13-6.12"
slots = 1
memory_gib = 8
ports = 0
gpu = false
payload_timeout = 3600
artifacts = ["/home/anvil/bench-bins.tgz", "/home/anvil/build.log"]
upload = true
payload = '''
set -uo pipefail
cd /home/anvil
(
  cat /etc/anvil-image.json 2>/dev/null || cat /etc/anvil-instance.json; echo
  rustc -V; uname -r
  mkdir -p out
  git clone -q {repo} src && git -C src checkout -q {ref} || exit 1
  ( cd src
    echo "== $(git log --oneline -1)"
    export CARGO_BUILD_JOBS=8 RUSTFLAGS="-C force-frame-pointers=yes"
    cargo build --locked --release -p ringline-bench --bin admission-server --bin admission-load || exit 1
    for b in admission-server admission-load; do cp target/release/$b ../out/; done
  ) || exit 1
  ( cd out && sha256sum * )
  nm out/admission-server | grep -c ' [tT] ' | sed 's/^/text symbols: /'
  ./out/admission-server --help | grep -q -- --stream-gate || { echo "admission-server lacks --stream-gate"; exit 1; }
  ./out/admission-load --help | grep -q -- --closed-loop || { echo "admission-load lacks --closed-loop"; exit 1; }
  echo "flags ok"
  tar czf bench-bins.tgz out
) > /home/anvil/build.log 2>&1
rc=$?
tail -30 /home/anvil/build.log
echo "RESULT build_status=$rc"
exit $rc
'''
