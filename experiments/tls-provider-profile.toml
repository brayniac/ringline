# TLS copy profile: where server user CPU goes with ringline-tls 0.1.1 on the
# ring provider (arm ring) and the aws-lc-rs provider (arm awslc), next to
# plain TCP (arm plain). Same binary, client and cells as tls-provider-ab.toml
# (bins from tls-provider-ab-build.toml). During each arm's 20 s window the
# server records /proc/stat deltas and a system-wide perf profile (no call
# graphs); after it, an 8 s DWARF call-graph profile of the server process.
# Reports are generated after the last arm. perf comes from
# perf-bundle-build.toml's perf.tgz; libc6-dbg is installed if the guest
# reaches the Debian mirror, so libc's memmove variants resolve by name.
# Question: how much server CPU do the two copies left on the TLS 1.3 path
# cost (send: plaintext into the pool slot inside encrypt_into; receive:
# decrypted plaintext into the accumulator)? An out-of-place AEAD on aws-lc-rs
# (rustls-quinn-forks-design.md, patch 3) would remove both.
# Prediction, written before running: at 1 MiB (80% GET) the send copy
# (0.8 MiB/op) and receive copy (0.2 MiB/op) together are 5-15% of server
# user CPU in the TLS arms, and a similar share at 64 KiB. Under 3% at both
# sizes refutes it and means patch 3 is not worth its risks for throughput.
# A memmove on the TLS path not accounted for by those two copies (for
# example a second receive copy on aws-lc-rs) is a finding on its own.
name = "tls provider profile v{vlen} d{depth} c{conns} rep{rep}"

[params]
bins_artifact  = "01a18e50-34ee-736e-e65e-40a552d37480"
perf_artifact  = "01a128b3-b76b-7345-0ea5-165591a7fc64"
client_bins    = "01a159f3-e054-73af-bc3f-8b6ea08f60b1"
image          = "debian-13-ci"
rep            = "1"
server_ip      = "172.31.0.1"
client_ip      = "172.31.0.2"
port           = "6379"
arms           = "plain ring awslc"
vlen           = "4096"
depth          = "16"
conns          = "2048"
keys           = "20000"
client_threads = "16"

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "barrier"
name = "vms-up"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/profile.tgz"]
payload_timeout = 3600
inputs = [
  { artifact = "{bins_artifact}", name = "bins.tgz", dest = "/home/anvil" },
  { artifact = "{perf_artifact}", name = "perf.tgz", dest = "/home/anvil" },
]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bins.tgz && tar xzf perf.tgz && chmod +x out/resp-server
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.core.rmem_max=134217728 net.core.wmem_max=134217728 kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 >/dev/null
# The guest's hard nofile limit is below 1048576, so `ulimit -n` alone
# leaves the soft limit at 1024.
ulimit -n 1048576 2>/dev/null || sudo prlimit --nofile=1048576:1048576 --pid $$
ulimit -l unlimited 2>/dev/null || sudo prlimit --memlock=unlimited:unlimited --pid $$
echo "server-limits memlock=$(ulimit -l) nofile=$(ulimit -n)"
# perf is not in the base image; perf.tgz carries out/perf/perf and its
# shared libraries in out/perf/lib.
if ! command -v perf >/dev/null && [ -x out/perf/perf ]; then
  printf '#!/bin/sh\nLD_LIBRARY_PATH=/home/anvil/out/perf/lib exec /home/anvil/out/perf/perf "$@"\n' | sudo tee /usr/local/bin/perf >/dev/null
  sudo chmod +x /usr/local/bin/perf
fi
command -v perf >/dev/null && echo "perf: $(perf --version)" || echo "perf: unavailable"
timeout 180 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libc6-dbg >/dev/null 2>&1 && echo "libc6-dbg: installed" || echo "libc6-dbg: unavailable"
mkdir -p prof
nproc; uname -r
( cd out && sha256sum resp-server )
conns() { ss -Htn state established "( sport = :{port} )" | wc -l; }
i=0
for arm in {arms}; do
  i=$((i+1))
  case $arm in
    plain) bin=resp-server;       args="--runtime ringline --send-slot 16448" ;;
    ring)  bin=resp-server;       args="--runtime ringline --send-slot 16448 --tls --tls-provider ring" ;;
    awslc) bin=resp-server;       args="--runtime ringline --send-slot 16448 --tls --tls-provider aws-lc-rs" ;;
    *) echo "BAD ARM $arm"; exit 1 ;;
  esac
  ./out/$bin $args --addr {server_ip}:{port} --workers 8 > prof/$i-$arm.server.log 2>&1 &
  pid=$!
  for j in $(seq 1 600); do [ "$(conns)" -ge {conns} ] && break; sleep 0.5; done
  # past the client's 10 s warmup
  sleep 15
  cat /proc/stat > prof/$i-$arm.stat0
  if command -v perf >/dev/null; then
    sudo perf record -a -F 499 -o prof/$i-$arm.perf.data -- sleep 20 2>prof/$i-$arm.perf.err
  else
    sleep 20
  fi
  cat /proc/stat > prof/$i-$arm.stat1
  if command -v perf >/dev/null; then
    sudo perf record -p $pid -F 199 --call-graph dwarf,8192 -o prof/$i-$arm.cg.data -- sleep 8 2>prof/$i-$arm.cg.err
  fi
  echo "== $i $arm conns=$(conns)"
  for j in $(seq 1 600); do [ "$(conns)" -eq 0 ] && break; sleep 0.5; done
  kill $pid; wait $pid 2>/dev/null
  sleep 2
done
i=0
for arm in {arms}; do
  i=$((i+1)); p=prof/$i-$arm
  if [ -f $p.perf.data ]; then
    sudo perf report -i $p.perf.data --stdio --no-children --sort comm,dso --percent-limit 0.5 2>/dev/null | grep -v '^#' | grep -v '^$' | head -40 > $p.dso.txt
    sudo perf report -i $p.perf.data --stdio --no-children --sort dso,sym --percent-limit 0.2 2>/dev/null | grep -v '^#' | grep -v '^$' | head -150 > $p.sym.txt
    sudo rm -f $p.perf.data
    echo "-- $i $arm top symbols"; head -25 $p.sym.txt
  fi
  if [ -f $p.cg.data ]; then
    # callers of each hot symbol, and inclusive time per function
    sudo perf report -i $p.cg.data --stdio --no-children --sort sym -G --percent-limit 1 2>/dev/null | grep -v '^$' | head -3000 > $p.cg.txt
    sudo perf report -i $p.cg.data --stdio --children --sort sym --percent-limit 0.5 -g none 2>/dev/null | grep -v '^#' | grep -v '^$' | head -200 > $p.incl.txt
    # one line per sample, frames leaf first, for offline folding
    sudo perf script -i $p.cg.data -F tid,ip,sym 2>/dev/null | gzip > $p.script.gz
    sudo rm -f $p.cg.data
  fi
done
python3 - <<'PY'
import os
hz=os.sysconf("SC_CLK_TCK"); W=20.0
for i,arm in enumerate("{arms}".split(), 1):
    def stat(f):
        for l in open(f"prof/{i}-{arm}.{f}"):
            if l.startswith("cpu "): return list(map(int,l.split()[1:9]))
    a,b=stat("stat0"),stat("stat1")
    names=["user","nice","system","idle","iowait","irq","softirq","steal"]
    d={n:(y-x)/hz/W for n,x,y in zip(names,a,b)}
    busy=d["user"]+d["system"]+d["softirq"]
    print(f"== {i} {arm}: busy={busy:.3f} cores " + " ".join(f"{n}={d[n]:.2f}" for n in names if n!="idle"))
PY
sudo chown -R anvil prof
tar czf /home/anvil/profile.tgz prof
exit 0
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "barrier"
name = "vms-up"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
payload_timeout = 3600
inputs = [{ artifact = "{client_bins}", name = "bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bins.tgz && chmod +x out/*
sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 net.ipv4.ip_local_port_range="1024 65535" >/dev/null
ulimit -n 1048576 2>/dev/null || sudo prlimit --nofile=1048576:1048576 --pid $$
ulimit -l unlimited 2>/dev/null || sudo prlimit --memlock=unlimited:unlimited --pid $$
echo "client-limits memlock=$(ulimit -l) nofile=$(ulimit -n)"
for arm in plain ring awslc; do
  tls=true; [ $arm = plain ] && tls=false
  cat > cell-$arm.toml <<CFG
[general]
duration = "50s"
warmup = "10s"
threads = {client_threads}
[target]
endpoints = ["{server_ip}:{port}"]
protocol = "resp"
tls = $tls
tls_verify = false
tls_hostname = "localhost"
[connection]
connections = {conns}
pipeline_depth = {depth}
connect_timeout = "10s"
request_timeout = "60s"
[workload]
backfill_on_miss = true
[workload.keyspace]
length = 16
count = {keys}
distribution = "uniform"
[workload.commands]
get = 80
set = 20
[workload.values]
length = {vlen}
[admin]
format = "json"
CFG
done
i=0
for arm in {arms}; do
  i=$((i+1))
  for j in $(seq 1 300); do (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; break; }; sleep 1; done
  ./out/cachecannon-a cell-$arm.toml > $i-$arm.json 2> $i-$arm.log
  echo "== $i $arm"; grep '"type":"result"' $i-$arm.json || { echo "NO RESULT"; tail -20 $i-$arm.log; }
  sleep 8
done
exit 0
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
