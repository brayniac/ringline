# Runs on hv01 (one VM, z2.c, backports kernel 7.1), not on the validation
# host: delta also runs frigate and the infra VMs, so its numbers carry other
# tenants' load (owner, 2026-10-06). The binary comes from
# experiments/recv-strategies-build.toml (bins_artifact).
# The 50k-connection cells of experiments/recv-hv01-highconn.toml, rerun
# after the server's accept deadline (60 s) proved too short. High
# connection counts (10k and 50k per worker): closed-loop capacity,
# fixed-rate arrivals at about 50% and 90% of capacity, and synchronized
# bursts (--burst: every connection sends at the same instant), which test
# ring depth. Records throughput, latency, ENOBUFS, peak RSS and the ring's
# residency for today's ring, INC 64 x 1 MiB and three plain geometries.
name = "ringline recv 50k connections hv01 (#622)"

[params]
bins_artifact = "01a11962-d3d2-7340-a27f-dea283693597"
image    = "spool/images/debian-13-ci-bpo-20261001.1@golden"
reps     = "3"
warmup   = "2"
duration = "8"
threads  = "12"

[[jobs]]
name = "recv-strategies"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
shape = "z2.c"
image = "{image}"
memory_gib = 32
ports = 0
gpu = false
payload_timeout = 21600
inputs = [{ artifact = "{bins_artifact}", name = "recv-bins.tgz", dest = "/home/anvil" }]
artifacts = ["/home/anvil/run.log"]
upload = true
payload = '''
set -uo pipefail
cd /home/anvil
{
  uname -srm; n=$(nproc); echo "nproc=$n"; lscpu | grep -E "Model name|MHz" | head -3
  [ "$n" -ge 8 ] || { echo "FATAL: need >=8 CPUs"; exit 1; }
  tar xzf recv-bins.tgz && chmod +x out/* && sha256sum out/recv-strategies
  B=/home/anvil/out/recv-strategies
  sudo sysctl -qw net.ipv4.ip_local_port_range="10000 65535" net.ipv4.tcp_tw_reuse=1 \
    net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535
  hard=$(ulimit -Hn); [ "$hard" = unlimited ] && hard=1048576; ulimit -n "$hard"
  echo "memlock=$(ulimit -l)"
  for len in 64 256 4096; do taskset -c 0 $B bytes-bench --iters 20000000 --len $len; done

  # label | server args
  defer=(
    "today_4M|--strategy shared --shared-bufs 256 --shared-buf-size 16384"
    "inc_64M_1m|--strategy shared_inc --shared-bufs 64 --shared-buf-size 1048576"
    "plain_64M_64k|--strategy shared --shared-bufs 1024 --shared-buf-size 65536"
    "plain_64M_1m|--strategy shared --shared-bufs 64 --shared-buf-size 1048576"
    "plain_1G_1m_nothp|--strategy shared --shared-bufs 1024 --shared-buf-size 1048576 --no-thp"
  )
  sqp=()
  # workload | conns | client args | server extra | sqpoll too?
  cells=(
    "reqack-256-closed|50000|--msg-size 256||0"
    "reqack-256-r23000|50000|--msg-size 256 --rate 23000||0"
    "reqack-256-r41000|50000|--msg-size 256 --rate 41000||0"
    "reqack-256-burst23000|50000|--msg-size 256 --rate 23000 --burst||0"
    "reqack-64k-closed|50000|--msg-size 65536||0"
    "reqack-64k-r15000|50000|--msg-size 65536 --rate 15000||0"
    "reqack-64k-r27000|50000|--msg-size 65536 --rate 27000||0"
    "reqack-64k-burst15000|50000|--msg-size 65536 --rate 15000 --burst||0"
    "mixed-closed|50000|--mix 256:9,65536:1||0"
    "mixed-r25000|50000|--mix 256:9,65536:1 --rate 25000||0"
    "mixed-r45000|50000|--mix 256:9,65536:1 --rate 45000||0"
    "mixed-burst25000|50000|--mix 256:9,65536:1 --rate 25000 --burst||0"
  )
  port=7000
  run_one() { # label, server args, workload, conns, client args, server extra, rep
    local label="$1" sargs="$2" wl="$3" conns="$4" cargs="$5" sextra="$6" rep="$7"
    port=$((port+1)); [ $port -gt 9900 ] && port=7001
    taskset -c 0 $B server --addr 127.0.0.1:$port --conns $conns $sargs $sextra \
      --warmup {warmup} --duration {duration} > srv.out 2> srv.err &
    local spid=$!
    sleep 0.3
    taskset -c 2-$((n-1)) $B client --addr 127.0.0.1:$port --conns $conns --threads {threads} \
      $cargs --warmup {warmup} --seconds $(( {warmup} + {duration} + 2 )) --start-delay-ms 1000 \
      > cli.out 2> cli.err
    wait $spid; local src=$?
    local r; r=$(grep '^RESULT' srv.out)
    if [ -z "$r" ]; then
      echo "FAIL rep=$rep wl=$wl conns=$conns cfg=$label server_exit=$src"
      sed 's/^/  srv| /' srv.err | tail -5; sed 's/^/  cli| /' cli.err | tail -5
    else
      echo "ROW rep=$rep wl=$wl cfg=$label $r $(cat cli.out)"
    fi
  }
  for rep in $(seq 1 {reps}); do
    for cell in "${cells[@]}"; do
      IFS='|' read -r wl conns cargs sextra withsq <<< "$cell"
      k=${#defer[@]}
      for i in $(seq 0 $((k-1))); do
        IFS='|' read -r label sargs <<< "${defer[$(( (i + rep) % k ))]}"
        run_one "$label" "$sargs" "$wl" "$conns" "$cargs" "$sextra" "$rep"
      done
      if [ "$withsq" = 1 ]; then
        for i in 0 1; do
          IFS='|' read -r label sargs <<< "${sqp[$(( (i + rep) % 2 ))]}"
          run_one "$label" "$sargs" "$wl" "$conns" "$cargs" "$sextra" "$rep"
        done
      fi
    done
  done
  echo "DONE"
} 2>&1 | tee /home/anvil/run.log
exit 0
'''

[[jobs.steps]]
type = "shell"
command = '''
grep -q '^DONE' run.log || { echo "run did not finish"; exit 1; }
echo "rows=$(grep -c '^ROW' run.log) fails=$(grep -c '^FAIL' run.log)"
'''
