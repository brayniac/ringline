# Protocol-server comparison (measurements 8 and 9 of
# docs/io-api-redesign.md). resp-server on hv02 (z1, 24 vCPU, 8 workers),
# cachecannon on hv01 (z2, 56 vCPU). One arm per experiment, all 12 cells
# per experiment; submit arms interleaved with at least four of each and
# discard the first round. rezolus records the server unit.
#   arm = ringline | tokio-pc | tokio-uring | ringline-inc | ringline-inc-nolimit
# The last two (branch exp/limit-ab) A/B the multishot byte limit on an
# incremental ring; they need a server kernel of 6.17 or later.
name = "ringline resp-arms {arm} rep{rep} server={server_image}"

[params]
bins_artifact = "REPLACE-WITH-ARTIFACT-ID"
arm           = "ringline"
rep           = "1"
image         = "spool/images/debian-13-base-20260912.1@golden"
# Server guest image; set to the backports image to run the server on 7.1.
server_image  = "spool/images/debian-13-base-20260912.1@golden"
server_ip     = "172.31.0.1"
client_ip     = "172.31.0.2"
port          = "6379"
workers       = "8"
client_threads = "16"
warmup        = "10s"
duration      = "20s"

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{server_image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bins.tgz && chmod +x out/*
cat /etc/anvil-instance.json
uname -r
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.core.rmem_max=134217728 net.core.wmem_max=134217728
case "{arm}" in
  ringline)          args="--runtime ringline" ;;
  ringline-ondemand) echo "ringline-ondemand is not built on this branch"; exit 1 ;;
  ringline-inc)      args="--runtime ringline --recv-incremental" ;;
  ringline-inc-nolimit) args="--runtime ringline --recv-incremental --no-recv-limit" ;;
  tokio-pc)          args="--runtime tokio-pc" ;;
  tokio-uring)       args="--runtime tokio-uring" ;;
  *) echo "BAD ARM {arm}"; exit 1 ;;
esac
echo "exec /home/anvil/out/resp-server $args --addr {server_ip}:{port} --workers {workers}" > /home/anvil/run-server.sh
chmod +x /home/anvil/run-server.sh
cat /home/anvil/run-server.sh
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
detach = true
unit = "resp-server"
metrics = true
payload = "ulimit -n 1048576; exec bash /home/anvil/run-server.sh"

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 7200

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
inputs = [{ artifact = "{bins_artifact}", name = "bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bins.tgz && chmod +x out/*
sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 net.ipv4.ip_local_port_range="1024 65535"
ping -c 2 -W 2 {server_ip} || echo "WARN: server not reachable yet"
'''

[[jobs.steps]]
type = "barrier"
name = "server-ready"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
metrics = true
upload = true
artifacts = ["/home/anvil/results.tgz"]
payload_timeout = 7000
payload = '''
set -uo pipefail
cd /home/anvil
mkdir -p results
ulimit -n 1048576
for i in $(seq 1 120); do
  (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; echo "server reachable after ${i}s"; break; }
  sleep 1
done
for vlen in 64 4096 65536; do
  case $vlen in 64) keys=100000;; 4096) keys=20000;; 65536) keys=2000;; esac
  for depth in 1 16; do
    for conns in 64 2048; do
      cell="v${vlen}-d${depth}-c${conns}"
      cat > results/$cell.toml <<CFG
[general]
duration = "{duration}"
warmup = "{warmup}"
threads = {client_threads}

[target]
endpoints = ["{server_ip}:{port}"]
protocol = "resp"

[connection]
connections = $conns
pipeline_depth = $depth
connect_timeout = "10s"
request_timeout = "5s"

[workload]
backfill_on_miss = true

[workload.keyspace]
length = 16
count = $keys
distribution = "uniform"

[workload.commands]
get = 80
set = 20

[workload.values]
length = $vlen

[admin]
format = "json"
CFG
      ./out/cachecannon results/$cell.toml > results/$cell.json 2> results/$cell.log
      echo "== arm={arm} rep={rep} cell=$cell"
      grep '"type":"result"' results/$cell.json || { echo "NO RESULT"; tail -5 results/$cell.log; }
      sleep 3
    done
  done
done
tar czf /home/anvil/results.tgz -C /home/anvil results
exit 0
'''

[[jobs.steps]]
type = "barrier"
name = "bench-done"
timeout = 7200

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
