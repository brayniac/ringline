name = "ktls-uring-fixedfd-probe"

# Follow-up premise check for docs/ktls-design.md: can kTLS keys be installed
# on an io_uring FIXED descriptor (ringline closes the raw fd after
# register_files_update), and does IORING_OP_SEND on such a socket produce
# TLS records?

[[jobs]]
name = "ktls-uring"
tags = ["z2.baremetal"]

[[jobs.steps]]
name = "io-uring-fixed-fd-probe"
type = "shell"
command = """
set -e
if ! command -v cargo >/dev/null && [ -f "$HOME/.cargo/env" ]; then source "$HOME/.cargo/env"; fi
if ! command -v cargo >/dev/null; then
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
  source "$HOME/.cargo/env"
fi
rustc --version
sudo modprobe tls || true
rm -rf /tmp/ktls-uring && mkdir -p /tmp/ktls-uring/src && cd /tmp/ktls-uring
cat > Cargo.toml <<'CARGOEOF'
[package]
name = "ktls-uring-probe"
version = "0.0.0"
edition = "2021"

[dependencies]
io-uring = "0.7.12"
libc = "0.2"

[[bin]]
name = "ktls-uring-probe"
path = "src/main.rs"
CARGOEOF
echo '' | base64 -d > src/main.rs
cargo build --release 2>&1 | tail -30
set +e
./target/release/ktls-uring-probe; rc=$?
echo "ktls_uring_probe exit=$rc"
exit $rc
"""
