# Where does the server's CPU go? One cell (value length, depth, connections)
# per arm, arms in sequence on the same VM pair. During each arm's measured
# window the server records a system-wide perf profile (no call graphs) and
# /proc/stat deltas, and keeps resp-server's diag lines.
#   arms: ringline (one-shot receives) | ringline-multishot | tokio-pc
name = "ringline resp profile v{vlen} d{depth} c{conns}"

[params]
bins_artifact  = "REPLACE-WITH-ARTIFACT-ID"
image          = "spool/images/debian-13-base-20260912.1@golden"
server_ip      = "172.31.0.1"
client_ip      = "172.31.0.2"
port           = "6379"
arms           = "ringline ringline-multishot tokio-pc"
vlen           = "4096"
depth          = "16"
conns          = "2048"
keys           = "20000"
client_threads = "16"

[[jobs]]
name = "server"
tags = ["z1.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z1.c"
image = "{image}"
gpu = false
data_address = "{server_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "barrier"
name = "vms-up"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
upload = true
artifacts = ["/home/anvil/profile.tgz"]
payload_timeout = 3600
inputs = [{ artifact = "{bins_artifact}", name = "bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bins.tgz && chmod +x out/*
sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.core.rmem_max=134217728 net.core.wmem_max=134217728 kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 >/dev/null
ulimit -n 1048576
ulimit -l unlimited 2>/dev/null || sudo prlimit --memlock=unlimited:unlimited --pid $$
echo "server-limits memlock=$(ulimit -l) nofile=$(ulimit -n)"
command -v perf >/dev/null || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq linux-perf >/dev/null 2>&1
command -v perf >/dev/null && echo "perf: $(perf --version)" || echo "perf: unavailable"
mkdir -p prof
nproc; uname -r
conns() { ss -Htn state established "( sport = :{port} )" | wc -l; }
for arm in {arms}; do
  case $arm in
    ringline)           args="--runtime ringline" ;;
    ringline-multishot) args="--runtime ringline --recv-multishot" ;;
    tokio-pc)           args="--runtime tokio-pc" ;;
  esac
  ./out/resp-server $args --addr {server_ip}:{port} --workers 8 > prof/$arm.server.log 2>&1 &
  pid=$!
  for i in $(seq 1 600); do [ "$(conns)" -ge {conns} ] && break; sleep 0.5; done
  # past the client's 10 s warmup
  sleep 15
  cat /proc/stat > prof/$arm.stat0
  if command -v perf >/dev/null; then
    sudo perf record -a -F 499 -o prof/$arm.perf.data -- sleep 20 2>prof/$arm.perf.err
  else
    sleep 20
  fi
  cat /proc/stat > prof/$arm.stat1
  echo "== $arm conns=$(conns)"
  if [ -f prof/$arm.perf.data ]; then
    sudo perf report -i prof/$arm.perf.data --stdio --no-children --sort comm,dso --percent-limit 0.5 2>/dev/null | grep -v '^#' | grep -v '^$' | head -40 > prof/$arm.dso.txt
    sudo perf report -i prof/$arm.perf.data --stdio --no-children --sort sym --percent-limit 0.3 2>/dev/null | grep -v '^#' | grep -v '^$' | head -120 > prof/$arm.sym.txt
    sudo rm -f prof/$arm.perf.data
    echo "-- $arm top dso"; head -15 prof/$arm.dso.txt
    echo "-- $arm top symbols"; head -40 prof/$arm.sym.txt
  fi
  for i in $(seq 1 600); do [ "$(conns)" -eq 0 ] && break; sleep 0.5; done
  kill $pid; wait $pid 2>/dev/null
  sleep 2
done
python3 - <<'PY'
import os
hz=os.sysconf("SC_CLK_TCK"); W=20.0
for arm in "{arms}".split():
    def stat(f):
        for l in open(f"prof/{arm}.{f}"):
            if l.startswith("cpu "): return list(map(int,l.split()[1:9]))
    a,b=stat("stat0"),stat("stat1")
    names=["user","nice","system","idle","iowait","irq","softirq","steal"]
    d={n:(y-x)/hz/W for n,x,y in zip(names,a,b)}
    print(f"== {arm}: cores " + " ".join(f"{n}={d[n]:.2f}" for n in names if n!="idle"))
PY
sudo chown -R anvil prof
tar czf /home/anvil/profile.tgz prof
exit 0
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
upload = true

[[jobs]]
name = "client"
tags = ["z2.baremetal"]

[[jobs.steps]]
type = "anvil-vm"
mode = "start"
shape = "z2.c"
image = "{image}"
gpu = false
data_address = "{client_ip}/24"
boot_timeout = 600

[[jobs.steps]]
type = "barrier"
name = "vms-up"
timeout = 1800

[[jobs.steps]]
type = "anvil-vm"
mode = "exec"
payload_timeout = 3600
inputs = [{ artifact = "{bins_artifact}", name = "bins.tgz", dest = "/home/anvil" }]
payload = '''
set -uo pipefail
cd /home/anvil && tar xzf bins.tgz && chmod +x out/*
sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 net.ipv4.ip_local_port_range="1024 65535" >/dev/null
ulimit -n 1048576
ulimit -l unlimited 2>/dev/null || sudo prlimit --memlock=unlimited:unlimited --pid $$
echo "client-limits memlock=$(ulimit -l) nofile=$(ulimit -n)"
cat > cell.toml <<CFG
[general]
duration = "50s"
warmup = "10s"
threads = {client_threads}
[target]
endpoints = ["{server_ip}:{port}"]
protocol = "resp"
[connection]
connections = {conns}
pipeline_depth = {depth}
connect_timeout = "10s"
request_timeout = "60s"
[workload]
backfill_on_miss = true
[workload.keyspace]
length = 16
count = {keys}
distribution = "uniform"
[workload.commands]
get = 80
set = 20
[workload.values]
length = {vlen}
[admin]
format = "json"
CFG
for arm in {arms}; do
  for i in $(seq 1 300); do (exec 3<>/dev/tcp/{server_ip}/{port}) 2>/dev/null && { exec 3>&-; break; }; sleep 1; done
  ./out/cachecannon cell.toml > $arm.json 2> $arm.log
  echo "== $arm"; grep '"type":"result"' $arm.json
  sleep 8
done
exit 0
'''

[[jobs.steps]]
type = "anvil-vm"
mode = "stop"
