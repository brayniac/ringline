# Profile of Experiment D's workload U (docs/send-admission-design.md,
# section 4; journal docs/journal/2026-11-send-admission-d.md): which code
# the worker's CPU runs per 7 MiB reply, whole or in pieces. The job is
# send-admission-d.toml with U's cell as the default, and perf recording
# CPU 0, where admission-server's one worker is pinned, for the length of
# the load's run: `perf record -e cpu-clock -C 0 -g --call-graph fp`.
# cpu-clock samples at a fixed rate whether or not the guest exposes
# hardware counters, so samples are CPU time, idle included (swapper).
# Recording CPU 0 rather than the worker's thread keeps the softirq work
# that loopback runs there, including the receiving socket's TCP
# processing. bins_artifact must be from send-admission-d-profile-build.toml
# (frame pointers). Parameters and the RUN, WORKER and LOAD lines are as in
# send-admission-d.toml; results.tgz adds perf-script.txt.gz (comm, tid, and
# each sample's stack of symbol and dso, from `perf script`) and three
# `perf report` summaries. Throughput and latency from these runs carry
# perf's overhead and are not quoted.
name = "send-admission D profile U {order} p{stream_piece} gate-{stream_gate} rep{rep}"

[params]
bins_artifact  = "REPLACE-WITH-ARTIFACT-ID"
workload       = "U"
small_send     = "admitted"
order          = "strict"
budget         = "32"
small_slots    = "256"
small_slot_size = "4096"
stream_piece   = "0"
stream_gate    = "off"
host           = "hv01"
admit_ms       = "1000"
settle_ms      = "1000"
pipeline       = "16"
rep            = "1"
image          = "debian-13-6.12"
warmup         = "4"
duration       = "40"
episode_ms     = "4000"
small_conns    = "0"
small_rate     = "0"
small_size     = "256"
stall_peers    = "0"
stall_size     = "3145728"
large_size     = "7340032"
large_delay_ms = "200"
head_rcvbuf    = "524288"
closed_loop    = "1000"
closed_warmup  = "10"
slow_conns     = "0"
slow_rate      = "0"
slow_size      = "4096"
slow_read_bps  = "0"
slow_rcvbuf    = "4096"
drainers       = "0"
drain_size     = "2097152"
drain_read_bps = "0"
drain_rcvbuf   = "4096"
outside_conns  = "0"
outside_rate   = "0"
outside_size   = "256"
tcp_wmem_max   = "1048576"
core_mem_max   = "16777216"
ss_interval    = "1"
pool_slots     = "512"
slot_size      = "16384"

[[jobs]]
name = "vm"
tags = ["host:{host}"]

[[jobs.steps]]
uses = "anvil-vm"
[jobs.steps.with]
shape = "auto.c"
image = "{image}"
memory_gib = 8
gpu = false
boot_timeout = 600
payload_timeout = 1200
upload = true
inputs = [{ artifact = "{bins_artifact}", name = "bench-bins.tgz", dest = "/home/anvil" }]
artifacts = ["/home/anvil/results.tgz"]
payload = '''
set -uo pipefail
export PATH="$PATH:/usr/sbin:/sbin"
cd /home/anvil && tar xzf bench-bins.tgz && chmod +x out/* || exit 1
mkdir -p results
command -v perf >/dev/null || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq linux-perf; } > results/perf-install.txt 2>&1
command -v perf >/dev/null || { tail -5 results/perf-install.txt; echo "STATUS no perf"; exit 1; }
perf --version
for t in sysctl ss nstat taskset ps perf; do command -v $t || echo "missing $t"; done | tee results/tools.txt
cat /etc/anvil-image.json 2>/dev/null || cat /etc/anvil-instance.json; echo
uname -r; nproc
( cd out && sha256sum admission-server admission-load )
ulimit -n 65536
cat /proc/sys/net/core/rmem_max /proc/sys/net/core/wmem_max | tee results/core-mem-image.txt
sudo sysctl -w net.ipv4.tcp_wmem="4096 16384 {tcp_wmem_max}"
sudo sysctl -w net.core.rmem_max={core_mem_max} net.core.wmem_max={core_mem_max}
sudo sysctl net.ipv4.tcp_rmem net.ipv4.tcp_wmem net.ipv4.tcp_mem net.core.rmem_max net.core.wmem_max | tee results/sysctl.txt
gate=""
if [ "{stream_gate}" = "on" ]; then gate="--stream-gate"; fi
runline="RUN workload={workload} small_send={small_send} order={order} budget={budget} small_slots={small_slots} small_slot_size={small_slot_size} stream_piece={stream_piece} stream_gate={stream_gate} host={host} admit_ms={admit_ms} settle_ms={settle_ms} pipeline={pipeline} tcp_wmem_max={tcp_wmem_max} core_mem_max={core_mem_max} small_conns={small_conns} small_rate={small_rate} small_size={small_size} stall_peers={stall_peers} stall_size={stall_size} large_size={large_size} head_rcvbuf={head_rcvbuf} closed_loop={closed_loop} closed_warmup={closed_warmup} slow_conns={slow_conns} slow_rate={slow_rate} slow_size={slow_size} slow_read_bps={slow_read_bps} slow_rcvbuf={slow_rcvbuf} drainers={drainers} drain_size={drain_size} drain_read_bps={drain_read_bps} drain_rcvbuf={drain_rcvbuf} episode_ms={episode_ms} duration={duration} outside_conns={outside_conns} outside_rate={outside_rate} outside_size={outside_size} ss_interval={ss_interval} pool_slots={pool_slots} slot_size={slot_size} rep={rep}"
cat /proc/net/sockstat > results/sockstat-before.txt
nstat -az TcpExtTCPMemoryPressures > results/nstat-before.txt 2>&1 || true
last=$(($(nproc) - 1))
./out/admission-server --addr 127.0.0.1:7979 --small-send {small_send} --order {order} --budget {budget} --small-slots {small_slots} --small-slot-size {small_slot_size} --admit-limit-ms {admit_ms} --settle-limit-ms {settle_ms} --pipeline {pipeline} --pool-slots {pool_slots} --slot-size {slot_size} --stream-piece {stream_piece} $gate --summary-file results/server-summary.json --cpu 0 > results/server.json 2> results/server.log &
srv=$!
for i in $(seq 1 100); do (exec 3<>/dev/tcp/127.0.0.1/7979) 2>/dev/null && { exec 3>&-; break; }; sleep 0.1; done
tid=$(ps -L -o tid=,comm= -p "$srv" | grep -w rl-work-0 | head -n 1 | sed 's/^ *//; s/ .*//' || true)
echo "server pid=$srv worker_tid=$tid"
if [ -z "$tid" ]; then
  echo "no rl-work-0 thread in pid $srv"; ps -L -o tid,comm -p "$srv"
  kill -INT $srv; wait $srv
  echo "$runline load_rc=-1"
  tar czf results.tgz results
  echo "STATUS load_rc=-1 no rl-work-0 thread"
  exit 0
fi
sched=/proc/$srv/task/$tid/schedstat
: > results/ports.txt
rm -f results/load.done
(
  while [ ! -e results/load.done ]; do
    t=$(date +%s%N)
    for kind in stall drain head; do
      port=$(grep " $kind 0 " results/ports.txt | tail -n 1 | cut -d' ' -f5 || true)
      if [ -n "$port" ]; then
        echo "SS $t $kind $port $(ss -tmiHO "( sport = :7979 and dport = :$port )" | tr '\n' ' ')"
      fi
    done
    sleep {ss_interval}
  done
) > results/ss.log 2>&1 &
sampler=$!
sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
sudo taskset -c 1 perf record -e cpu-clock -F 4000 -C 0 -g --call-graph fp -o results/perf.data > results/perf-record.txt 2>&1 &
perfpid=$!
sleep 1
cpu0=$(cut -d' ' -f1 "$sched" 2>/dev/null || echo 0); wall0=$(date +%s%N)
taskset -c 2-$last ./out/admission-load --addr 127.0.0.1:7979 --duration {duration} --warmup {warmup} --within-ms {admit_ms} --episode-ms {episode_ms} --small-conns {small_conns} --small-rate {small_rate} --small-size {small_size} --stall-peers {stall_peers} --stall-size {stall_size} --large-size {large_size} --large-delay-ms {large_delay_ms} --head-rcvbuf {head_rcvbuf} --closed-loop {closed_loop} --closed-warmup {closed_warmup} --slow-conns {slow_conns} --slow-rate {slow_rate} --slow-size {slow_size} --slow-read-bps {slow_read_bps} --slow-rcvbuf {slow_rcvbuf} --drainers {drainers} --drain-size {drain_size} --drain-read-bps {drain_read_bps} --drain-rcvbuf {drain_rcvbuf} --outside-conns {outside_conns} --outside-rate {outside_rate} --outside-size {outside_size} --ports-file results/ports.txt > results/load.json 2> results/load.log
rc=$?
cpu1=$(cut -d' ' -f1 "$sched" 2>/dev/null || echo 0); wall1=$(date +%s%N)
sudo kill -INT $perfpid; wait $perfpid
sudo chown -R "$(id -u)" results
echo "PERF window_ns=$((wall1 - wall0)) $(tail -2 results/perf-record.txt | tr '\n' ' ')"
perf script -i results/perf.data -F comm,tid,time,ip,sym,dso 2>results/perf-script.err | gzip > results/perf-script.txt.gz
perf report -i results/perf.data --stdio --no-children --sort comm,dso -g none > results/perf-dso.txt 2>&1
perf report -i results/perf.data --stdio --no-children --sort dso,sym -g none --percent-limit 0.2 > results/perf-self.txt 2>&1
perf report -i results/perf.data --stdio --children --sort sym -g none --percent-limit 0.5 > results/perf-children.txt 2>&1
rm -f results/perf.data
head -40 results/perf-dso.txt
touch results/load.done
wait $sampler
cat /proc/net/sockstat > results/sockstat-after.txt
nstat -az TcpExtTCPMemoryPressures > results/nstat-after.txt 2>&1 || true
kill -INT $srv; wait $srv
echo "WORKER cpu_ns=$((cpu1 - cpu0)) wall_ns=$((wall1 - wall0)) tid=$tid" | tee results/worker.txt
echo "$runline load_rc=$rc"
echo "LOAD $(cat results/load.json)"
echo "SERVER $(cat results/server-summary.json)"
cat results/sockstat-before.txt results/sockstat-after.txt results/nstat-before.txt results/nstat-after.txt
tail -3 results/server.log results/load.log
tar czf results.tgz results
echo "STATUS load_rc=$rc"
exit 0
'''
