[package]
name = "ringline-redis"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Redis (RESP) client for the ringline io_uring runtime"

[features]
default = ["metrics"]
metrics = ["dep:histogram"]
# Forward the runtime's mio-backend override, so `--features force-mio` on
# this crate builds `ringline` with the mio backend.
force-mio = ["ringline/force-mio"]

[dependencies]
bytes = { workspace = true }
histogram = { workspace = true, optional = true }
itoa = { workspace = true }
ketama = { workspace = true }
ringline = { workspace = true }
resp-proto = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
resp-proto = { version = "0.0.2", features = ["resp3"] }
criterion = { version = "0.5", features = ["html_reports"] }
ringline = { workspace = true, features = ["testing"] }

[[bench]]
name = "resp_bench"
harness = false
